<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Assistant</title>
<style>
:root{--bg:#0b1020;--panel:#141b34;--me:#2f6bff;--ai:#1d2644;--tx:#e8ecff}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel)}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover}
header button{margin-left:auto;background:none;border:1px solid #3a4570;color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(720px,85%);padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me)}.ai{align-self:flex-start;background:var(--ai)}
form{display:flex;gap:8px;padding:12px 16px;background:var(--panel)}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #3a4570;background:var(--bg);color:var(--tx);font:inherit}
form button{background:var(--me);border:0;color:#fff;border-radius:10px;padding:0 18px;font:inherit;cursor:pointer}
</style></head><body>
<header><img src="face.png" alt=""><b>AI Assistant</b><button id="clr">Clear</button></header>
<div id="log" aria-live="polite"></div>
<form id="f"><input id="t" placeholder="Type a message…" autocomplete="off" autofocus aria-label="Message"><button>Send</button></form>
<script>
const URL_="https://grrewipaejntnqocbnjd.supabase.co/functions/v1/chat";
const KEY="sb_publishable_Xizw-HHQZKPNqdZ8LeDz4w_C_sjBrAn"; // public by design
const log=document.getElementById("log"),t=document.getElementById("t");
let hist=[];try{hist=JSON.parse(localStorage.h||"[]")}catch{}
const add=(role,text)=>{const d=document.createElement("div");d.className="m "+(role=="user"?"me":"ai");d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;return d};
const save=()=>{try{localStorage.h=JSON.stringify(hist.slice(-40))}catch{}};
hist.forEach(m=>add(m.role,m.content));
if(!hist.length)add("assistant","Hello sir, how can I help?");
f.onsubmit=async e=>{e.preventDefault();const q=t.value.trim();if(!q)return;t.value="";
 hist.push({role:"user",content:q});add("user",q);const b=add("assistant","…");
 try{const r=await fetch(URL_,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify({messages:hist})});
  const d=await r.json();if(!r.ok)throw Error(d.error||r.status);
  b.textContent=d.reply;hist.push({role:"assistant",content:d.reply});save();
 }catch(err){b.textContent="Sorry sir, something went wrong: "+err.message;hist.pop();}};
clr.onclick=()=>{hist=[];save();log.innerHTML="";add("assistant","Hello sir, how can I help?")};
</script></body></html>
